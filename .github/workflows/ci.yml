name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests dashboard
      - run: pytest
      - name: End-to-end run on synthetic data
        run: |
          retailpulse generate --customers 3000
          retailpulse run --folds 2
          test -f artifacts/RESULTS.md
